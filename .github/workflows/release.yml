name: Release

# Prepares a release up to the point of shipping it, and ships nothing.
#
# Runs when a version bump lands on main (Cargo.toml), by hand, or on a v* tag
# pushed by hand. It checks the release is complete (release.py check), builds
# and smoke-tests every artifact, and leaves them in a draft GitHub release with
# the notes from docs/releases/v<version>.md. The draft creates no tag and is
# invisible to the public; the homelab image is kept as a workflow artifact
# instead of being pushed. Re-running it replaces the draft for that version.
#
# Shipping is ship.yml, run by Mischa: see docs/releases/RELEASING.md.

on:
  push:
    branches: [main]
    paths: ["Cargo.toml"]
    tags: ["v*"]
  workflow_dispatch:

# Shared with ship.yml, so a draft is never replaced while it is being shipped.
concurrency:
  group: dogubako-release
  cancel-in-progress: false

jobs:
  gate:
    name: Is there a release to prepare?
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      prepare: ${{ steps.v.outputs.prepare }}
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          version="$(python3 -I packaging/release/release.py current)"
          tag="v$version"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the version on that commit ($version)."; exit 1
          fi
          # A tag pushed earlier fixes the release's commit: build that, not a later one.
          tagged="$(git ls-remote origin "refs/tags/$tag" "refs/tags/$tag^{}" | tail -n1 | cut -f1)"
          if [ -n "$tagged" ] && [ "$tagged" != "$GITHUB_SHA" ]; then
            echo "::error::Tag $tag already exists at $tagged, not $GITHUB_SHA. Run Release on the tag, or bump the version."; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          draft="$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null || echo none)"
          if [ "$draft" = false ]; then
            if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF_TYPE" = branch ]; then
              echo "::notice::$tag is already published; no new version on main, nothing to prepare."
              echo "prepare=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
            echo "::error::$tag is already published. Bump the version (release.py bump) to make a new release."; exit 1
          fi
          echo "prepare=true" >> "$GITHUB_OUTPUT"
      - name: Release is complete (versions, changelog, notes, generated docs, pages)
        if: steps.v.outputs.prepare == 'true'
        run: python3 -I packaging/release/release.py check
      - name: Replace an earlier draft of this version
        if: steps.v.outputs.prepare == 'true'
        run: |
          if gh release view "${{ steps.v.outputs.tag }}" --json isDraft --jq .isDraft 2>/dev/null | grep -qx true; then
            gh release delete "${{ steps.v.outputs.tag }}" --yes
          fi

  generated-docs:
    name: Generated docs are current
    needs: gate
    if: needs.gate.outputs.prepare == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci && npm run build
        working-directory: web
      - run: npm ci
        working-directory: site
      - run: cargo build --locked -p dogubako-cli
      - run: python3 -I packaging/release/release.py regen --check
      - name: Keep the regenerated docs
        if: failure()
        run: git diff > regenerated-docs.diff
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: regenerated-docs
          path: regenerated-docs.diff
      - name: Third-party notices are current
        run: python3 -I packaging/release/notices.py --check
      # Every page, internal link and anchor of docs.dogubako.app at this commit.
      - run: npm run build
        working-directory: site

  website:
    name: Website for this release
    needs: gate
    if: needs.gate.outputs.prepare == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download links point at this release
        run: |
          mkdir _site && cp -R website/. _site/
          python3 -I packaging/release/website_links.py _site --docs --release "${{ needs.gate.outputs.tag }}"
          python3 -I packaging/release/website_links.py _site --check
          grep -rl "releases/download/${{ needs.gate.outputs.tag }}/" _site >/dev/null

  # The alpha is macOS only: Linux and Windows desktop bundles come back once
  # their installers accept the pre-release version (Tauri's MSI does not).
  desktop:
    name: macOS app (Apple silicon)
    needs: [gate, generated-docs, website]
    runs-on: macos-15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: aarch64-apple-darwin }
      - run: npm ci
        working-directory: web
      - name: Apple signing (optional)
        # Only exported when set, so a missing secret means an unsigned build
        # instead of a failed signing attempt with empty values.
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            val="$(printenv "$v" || true)"
            if [ -n "$val" ]; then
              delim="EOF_$(openssl rand -hex 8)"
              printf '%s<<%s\n%s\n%s\n' "$v" "$delim" "$val" "$delim" >> "$GITHUB_ENV"
            fi
          done
          if [ -z "${APPLE_SIGNING_IDENTITY:-}" ]; then echo "::notice::No Apple signing identity: building an unsigned DMG"; fi
          # Re-signs each engine folder (bundled and every pack) before packing;
          # a no-op without APPLE_SIGNING_IDENTITY.
          if [ -x packaging/macos/sign-engines.sh ]; then
            echo "DOGUBAKO_ENGINE_SIGN_CMD=$PWD/packaging/macos/sign-engines.sh" >> "$GITHUB_ENV"
          fi
      - name: Engines
        env:
          # The app downloads on-demand engines from this release's assets.
          DOGUBAKO_ENGINE_PACK_BASE_URL: https://github.com/${{ github.repository }}/releases/download/${{ needs.gate.outputs.tag }}
        run: |
          python3 -I packaging/engines/lock.py --check
          python3 -I packaging/engines/fetch.py
          packaging/engines/build-from-source.sh whisper
          python3 -I packaging/engines/assemble.py
          sudo mv /opt/homebrew /opt/homebrew.hidden
          packaging/engines/smoke.sh apps/desktop/src-tauri/engines build/engines/packs/*/
          sudo mv /opt/homebrew.hidden /opt/homebrew
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Without a Developer ID, ad-hoc sign the bundle ("-"): an unsigned
          # bundle shows as "damaged" once downloaded, instead of Open Anyway.
          # Engines are signed earlier, so this only affects the app bundle.
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY || '-' }}
        with:
          projectPath: apps/desktop/src-tauri
          tagName: ${{ needs.gate.outputs.tag }}
          releaseName: Dogubako ${{ needs.gate.outputs.tag }}
          releaseBody: See the release notes below once they are attached.
          releaseDraft: true
          prerelease: ${{ contains(needs.gate.outputs.tag, '-') }}
          # The tag is created at this commit only when ship.yml publishes the draft.
          releaseCommitish: ${{ github.sha }}
          args: --target aarch64-apple-darwin --config tauri.engines.conf.json
      - name: Upload engine packs and notes
        run: |
          gh release upload "${{ needs.gate.outputs.tag }}" build/engines/packs/*.tar.gz build/engines/packs/packs.json --clobber
          python3 -I packaging/release/release.py notes-body "${{ needs.gate.outputs.version }}" > notes.md
          gh release edit "${{ needs.gate.outputs.tag }}" --notes-file notes.md

  cli:
    name: CLI/server binary (${{ matrix.target }})
    needs: [gate, desktop]   # uploads into the draft release the desktop job created
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: macos-15, target: aarch64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, ext: .exe }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci && npm run build
        working-directory: web
      - uses: dtolnay/rust-toolchain@stable
        if: runner.os != 'Linux'
        with: { targets: "${{ matrix.target }}" }
      - if: runner.os != 'Linux'
        run: cargo build --release --locked -p dogubako-cli --target ${{ matrix.target }}
      - name: Smoke test
        if: runner.os != 'Linux'
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release/dogubako${{ matrix.ext }}"
          "$bin" --version | grep -F "${{ needs.gate.outputs.version }}"
          "$bin" tools list >/dev/null
      # Built in a glibc 2.28 container so it runs on older distros than the
      # runner, then checked on the oldest and a current stable distro.
      - name: Build and check (Linux, glibc 2.28+)
        if: runner.os == 'Linux'
        run: |
          bin="$(packaging/release/build-linux-cli.sh)"
          packaging/release/check-linux-cli.sh "$bin"
      - name: Attach to the release
        shell: bash
        run: |
          out="dogubako-${{ matrix.target }}${{ matrix.ext }}"
          cp "target/${{ matrix.target }}/release/dogubako${{ matrix.ext }}" "$out"
          gh release upload "${{ needs.gate.outputs.tag }}" "$out" --clobber

  homelab-image:
    name: Homelab image (linux/amd64, kept for ship.yml)
    needs: gate
    if: needs.gate.outputs.prepare == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      IMAGE: ghcr.io/mischa-dev/dogubako:${{ needs.gate.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Built and tested here but not pushed: ship.yml pushes this exact image.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ env.IMAGE }}
      - name: Smoke test
        run: |
          set -eux
          docker run --rm "$IMAGE" --version | grep -F "${{ needs.gate.outputs.version }}"
          docker run --rm "$IMAGE" deps | tee deps.txt
          for e in FFmpeg qpdf Poppler Ghostscript Tesseract Pandoc 7-Zip ImageMagick ExifTool whisper.cpp Piper; do
            grep -E "✓ +$e" deps.txt
          done
          mkdir -p data && sudo chown 10001 data
          docker run -d --name dgb -p 8420:8420 -v "$PWD/data:/data" "$IMAGE"
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8420/healthz && break; sleep 2; done
          curl -fsS http://127.0.0.1:8420/healthz
          docker rm -f dgb
      - run: docker save "$IMAGE" | gzip -1 > homelab-image.tar.gz && ls -lh homelab-image.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: homelab-image
          path: homelab-image.tar.gz
          retention-days: 30
          compression-level: 0

  engine-sources:
    name: Engine source code (GPL source offer)
    needs: [gate, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      # Fails if any engine's source can't be fetched: no release without it.
      - run: python3 -I packaging/release/engine_sources.py --version "${{ needs.gate.outputs.version }}"
      - run: gh release upload "${{ needs.gate.outputs.tag }}" "build/release/engine-sources-${{ needs.gate.outputs.version }}.tar" --clobber

  checksums:
    name: SHA256SUMS.txt
    needs: [gate, desktop, cli, engine-sources, homelab-image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checksum every release asset
        run: |
          mkdir assets && cd assets
          gh release download "${{ needs.gate.outputs.tag }}" --repo "${{ github.repository }}" --pattern '*'
          rm -f SHA256SUMS.txt
          sha256sum * | tee ../SHA256SUMS.txt
          cd .. && gh release upload "${{ needs.gate.outputs.tag }}" SHA256SUMS.txt --repo "${{ github.repository }}" --clobber
