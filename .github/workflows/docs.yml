name: Docs site

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["site/**", ".github/workflows/docs.yml"]
  workflow_dispatch:
    inputs:
      ref:
        description: Release tag or commit to deploy (e.g. v0.1.0-alpha.1); empty deploys main if published
        type: string
        default: ""
  # ship.yml deploys the docs for the release it just published (deploy: true),
  # so missing Cloudflare secrets or an unpublished release fail the run there.
  workflow_call:
    inputs:
      ref: { type: string, default: "" }
      deploy: { type: boolean, default: false }

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build docs (docs.dogubako.app)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      # Builds every page, checks every internal link and anchor, and builds the search index.
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: site/dist

  deploy:
    # Publishes to Cloudflare Pages on pushes to main, once the two secrets exist
    # and the version on main is a published release. While a bumped version
    # waits for Ship release, the docs (which name it as current) stay as they
    # are; ship.yml deploys them once it publishes. Otherwise nothing is deployed.
    # Pushes skip quietly when a check fails; a Ship deploy (deploy: true) or a
    # manual run given a ref fails.
    name: Deploy to Cloudflare Pages
    needs: build
    if: inputs.deploy || (github.event_name != 'pull_request' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Check for Cloudflare credentials and a published release
        id: creds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUIRED: ${{ (inputs.deploy || (github.event_name == 'workflow_dispatch' && inputs.ref)) && '1' || '' }}
        run: |
          skip() {
            if [ -n "$REQUIRED" ]; then echo "::error::$1"; exit 1; fi
            echo "::notice::$1; skipping deploy."; exit 0
          }
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            skip "CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not set"
          fi
          tag="v$(python3 -I packaging/release/release.py current)"
          if [ "$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null)" != false ]; then
            skip "$tag is not published yet; the docs deploy when Ship release publishes it"
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"
        working-directory: .
      - if: steps.creds.outputs.ok == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - if: steps.creds.outputs.ok == 'true'
        run: npm ci
      - if: steps.creds.outputs.ok == 'true'
        uses: actions/download-artifact@v4
        with:
          name: docs-site
          path: site/dist
      - if: steps.creds.outputs.ok == 'true'
        run: npx wrangler pages deploy dist --project-name dogubako-docs --branch main --commit-dirty=true
