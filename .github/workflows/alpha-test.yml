name: Alpha test builds

# Unsigned test builds for trying the alpha before a release: an Apple-silicon
# DMG with every engine inside (no downloads needed), and the homelab Docker
# image. Both are smoke-tested and kept as workflow artifacts. Nothing is
# published, tagged or pushed to a registry.
on:
  workflow_dispatch:
  push:
    branches: [claude/project-thread-j1bqd1]

concurrency:
  group: alpha-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dmg:
    name: Test DMG (macOS arm64, unsigned)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: aarch64-apple-darwin }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: apps/desktop/src-tauri }
      - uses: actions/cache@v4
        with:
          path: build/engines/cache
          key: engines-${{ hashFiles('packaging/engines/engines.lock.json') }}
      - run: npm ci
        working-directory: web
      - name: Engines (all inside the app for testing)
        run: |
          python3 -I packaging/engines/fetch.py
          packaging/engines/build-from-source.sh whisper
          python3 -I packaging/engines/assemble.py --bundle-all
      - name: Build the app
        working-directory: apps/desktop/src-tauri
        # Ad-hoc sign the whole bundle. Without a bundle signature macOS calls
        # a downloaded app "damaged" instead of offering Open Anyway.
        env:
          APPLE_SIGNING_IDENTITY: "-"
        run: npx --yes @tauri-apps/cli@2 build --target aarch64-apple-darwin --bundles dmg --config tauri.engines.conf.json
      - name: Smoke test the DMG
        run: |
          set -eux
          dmg="$(ls apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg)"
          mnt="$(mktemp -d)"
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$dmg"
          app="$mnt/Dogubako.app"
          test -f "$app/Contents/Resources/engines/manifest.json"
          # The bundle carries a valid (ad-hoc) signature covering everything inside.
          codesign -dv "$app" 2>&1 | tee sig.txt
          grep -q 'Signature=adhoc' sig.txt
          grep -q 'Sealed Resources' sig.txt
          codesign --verify --deep --strict --verbose=2 "$app"
          # Engines run from inside the installed app with Homebrew out of the way.
          sudo mv /opt/homebrew /opt/homebrew.hidden
          packaging/engines/smoke.sh "$app/Contents/Resources/engines"
          # The app starts and stays up.
          cp -R "$app" "$RUNNER_TEMP/"
          exe="$(find "$RUNNER_TEMP/Dogubako.app/Contents/MacOS" -type f -perm -u+x | head -1)"
          # It links only system libraries, nothing from Homebrew or /usr/local.
          otool -L "$exe"
          if otool -L "$exe" | tail -n +2 | grep -Ev '^[[:space:]]*(/usr/lib/|/System/Library/|@rpath/|@executable_path/)'; then
            echo "app links a library users won't have"; exit 1
          fi
          "$exe" &
          pid=$!
          sleep 15
          kill -0 "$pid"
          kill "$pid"
          sudo mv /opt/homebrew.hidden /opt/homebrew
          hdiutil detach "$mnt"
          echo "DMG=$dmg" >> "$GITHUB_ENV"
          ls -lh "$dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: Dogubako-alpha-macos-arm64-dmg
          path: ${{ env.DMG }}
          retention-days: 14
          compression-level: 0

  homelab:
    name: Homelab image (linux/amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: dogubako:alpha
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          set -eux
          docker run --rm dogubako:alpha deps | tee deps.txt
          for e in FFmpeg qpdf Poppler Ghostscript Tesseract Pandoc 7-Zip ImageMagick ExifTool whisper.cpp Piper; do
            grep -E "✓ +$e" deps.txt
          done
          mkdir -p data && sudo chown 10001 data
          docker run -d --name dgb -p 8420:8420 -v "$PWD/data:/data" dogubako:alpha
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8420/healthz && break; sleep 2; done
          curl -fsS http://127.0.0.1:8420/healthz
          docker logs dgb | tail -20
          docker rm -f dgb
      - name: Save image
        run: docker save dogubako:alpha | gzip -1 > dogubako-alpha-amd64.tar.gz && ls -lh dogubako-alpha-amd64.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: dogubako-alpha-homelab-image-amd64
          path: dogubako-alpha-amd64.tar.gz
          retention-days: 14
          compression-level: 0
