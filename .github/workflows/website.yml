name: Website

# Builds the dogubako.app site into _site and publishes it to the Cloudflare
# Pages project "dogubako-website" when run by hand with deploy ticked, by
# ship.yml when Mischa ships a release, or on a push to main once main's
# version is a published release (so fixes like a new tool count go live
# without waiting for the next release). While a bumped version waits for
# Ship release, pushes only build. Pull requests only build.
#
# It publishes website/ (the design concepts in design/website-concepts/ are
# never published). Inputs flip the links once things are live:
#   docs_live docs.dogubako.app is deployed: point docs links there
#   release   the published release tag: point downloads at its assets
on:
  push:
    branches: [main]
    paths: ["website/**", "deploy/website/**", "packaging/release/website_links.py", ".github/workflows/website.yml"]
  pull_request:
    paths: ["website/**", "deploy/website/**", "packaging/release/website_links.py", ".github/workflows/website.yml"]
  workflow_dispatch:
    inputs:
      docs_live:
        description: docs.dogubako.app is live
        type: boolean
        default: false
      release:
        description: Published release tag (e.g. v0.1.0-alpha.1), or empty
        type: string
        default: ""
      deploy:
        description: Publish to Cloudflare Pages (production)
        type: boolean
        default: false
  # ship.yml deploys the site for the release it just published.
  workflow_call:
    inputs:
      docs_live: { type: boolean, default: true }
      release: { type: string, default: "" }
      deploy: { type: boolean, default: false }
      ref: { type: string, default: "" }

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.published.outputs.deploy }}
    env:
      DOCS_LIVE: ${{ inputs.docs_live && '1' || '' }}
      RELEASE: ${{ inputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: On a push to main, deploy for the published release
        id: published
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v$(python3 -I packaging/release/release.py current)"
          if [ "$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null)" != false ]; then
            echo "::notice::$tag is not published yet; the site deploys when Ship release publishes it."
            exit 0
          fi
          { echo "DOCS_LIVE=1"; echo "RELEASE=$tag"; } >> "$GITHUB_ENV"
          echo "deploy=true" >> "$GITHUB_OUTPUT"
      - name: Assemble _site
        run: |
          set -eu
          if [ ! -d website ]; then
            # Branches below the website PR (#3) have no site yet.
            echo "::notice::No website/ folder on this branch; nothing to build."
            echo "NO_SITE=1" >> "$GITHUB_ENV"
            exit 0
          fi
          mkdir _site
          cp -R website/. _site/
          # The trailer lives once in trailer/dist; without it the page shows its placeholder.
          if [ -f trailer/dist/dogubako-alpha-trailer.mp4 ] && [ -f trailer/dist/poster.jpg ]; then
            mkdir -p _site/trailer
            cp trailer/dist/dogubako-alpha-trailer.mp4 trailer/dist/poster.jpg _site/trailer/
          else
            echo "::warning::Trailer not found in trailer/dist; the page shows its placeholder."
          fi
          # Build scripts, notes and review material don't belong on the public site.
          rm -rf _site/concepts _site/review _site/scripts _site/README.md _site/NOTES.md _site/.gitignore
          cp deploy/website/_headers _site/_headers
      - name: Point links at live docs and the release
        if: env.NO_SITE != '1'
        run: |
          args=""
          [ -n "$DOCS_LIVE" ] && args="$args --docs"
          [ -n "$RELEASE" ] && args="$args --release $RELEASE"
          # Always version the CSS and script links, so a browser that still has the
          # previous files cached never pairs them with the new pages.
          python3 -I packaging/release/website_links.py _site ${args:---stamp}
          echo "### Still pointing at branches or saying prerelease" >> "$GITHUB_STEP_SUMMARY"
          python3 -I packaging/release/website_links.py _site --check | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Check local references resolve
        if: env.NO_SITE != '1'
        run: |
          python3 -I - <<'PY'
          import re, sys
          from pathlib import Path
          root = Path("_site"); bad = []
          for page in root.rglob("*.html"):
              for ref in re.findall(r'(?:src|href)="([^"#?:]+)"', page.read_text(encoding="utf-8")):
                  if ref.startswith(("/", "mailto")) or ref.startswith("trailer/"):
                      continue
                  if not (page.parent / ref).exists():
                      bad.append(f"{page.relative_to(root)} -> {ref}")
          print("\n".join(bad) or "all local references resolve")
          sys.exit(1 if bad else 0)
          PY
      - uses: actions/upload-artifact@v4
        if: env.NO_SITE != '1'
        with:
          name: website
          path: _site
          retention-days: 14

  deploy:
    name: Deploy to Cloudflare Pages
    needs: build
    if: inputs.deploy || needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: website
      url: https://dogubako.app
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check for Cloudflare credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not set."; exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: website
          path: _site
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npx --yes wrangler@4 pages deploy _site --project-name dogubako-website --branch main --commit-dirty=true
