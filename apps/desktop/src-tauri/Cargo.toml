[package]
name = "dogubako-desktop"
version = "0.1.0"
description = "Dogubako desktop app (Tauri 2)"
edition = "2021"
license = "AGPL-3.0-or-later"

# Standalone workspace so building the server/CLI never needs GTK/WebKit.
[workspace]

[lib]
name = "dogubako_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dogubako-core = { path = "../../../crates/core" }
dogubako-tools = { path = "../../../crates/tools" }
dogubako-mcp = { path = "../../../crates/mcp" }
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
