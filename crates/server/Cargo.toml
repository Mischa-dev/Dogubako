[package]
name = "dogubako-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
argon2 = "0.6.0"
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["multipart", "macros"] }
base64 = "0.23.1"
dogubako-core = { workspace = true }
dogubako-mcp = { path = "../mcp" }
dogubako-tools = { path = "../tools", default-features = false }
futures = "0.3.34"
hex = "0.4.3"
mime_guess = "2.0.5"
rand = "0.10.3"
rusqlite = { version = "0.41.1", features = ["bundled"] }
rust-embed = "8.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["full"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tokio-util = { version = "0.7.20", features = ["io"] }
toml = "1.1.8"
tower-http = { version = "0.7.1", features = ["trace", "set-header", "limit", "compression-gzip", "compression-br"] }
tracing = "0.1.44"
uuid = { version = "1.29.0", features = ["v4"] }
zip = { version = "9.2.1", default-features = false, features = ["deflate"] }

[features]
default = ["all-tools"]
all-tools = ["dogubako-tools/default"]
text-tools = ["dogubako-tools/text"]

[dev-dependencies]
http-body-util = "0.1.5"
tokio = { version = "1.54.1", features = ["full", "test-util"] }
tower = { version = "0.5.3", features = ["util"] }
