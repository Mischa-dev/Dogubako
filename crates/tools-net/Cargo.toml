[package]
name = "dogubako-tools-net"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
base64 = "0.23"
chrono = "0.4.45"
dogubako-core = { workspace = true }
ed25519-dalek = "2"
futures = "0.3.34"
hex = "0.4.3"
hickory-resolver = { version = "0.26", features = ["https-aws-lc-rs"] }
idna = "1.1.0"
ipnet = "2.12.2"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream"] }
rustls = "0.23"
scraper = "0.29.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.11"
sha2 = "0.11"
ssh-key = { version = "0.6", default-features = false, features = ["ecdsa", "std"] }
tokio = { version = "1", features = ["full"] }
tokio-rustls = "0.26"
url = "2.5.8"
webpki-roots = "1"
x509-parser = "0.18"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
tempfile = "3"
rcgen = "0.14"
