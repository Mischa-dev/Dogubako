[package]
name = "dogubako-core"
description = "Dogubako tool engine: registry, schemas, validation, safe execution"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
async-trait = "0.1.92"
base64 = "0.23.1"
flate2 = "1.1.10"
futures = "0.3.34"
hex = "0.4.3"
ipnet = "2.12.2"
libc = "0.2.191"
mime_guess = "2.0.5"
rand = "0.10.3"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "json", "gzip", "brotli", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.1"
tar = "0.4.46"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
toml = "1.1.8"
tracing = "0.1.44"
url = "2.5.8"
uuid = { version = "1.29.0", features = ["v4"] }
which = "8.0.6"
