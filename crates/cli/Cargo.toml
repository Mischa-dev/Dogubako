[package]
name = "dogubako-cli"
description = "Dogubako command-line interface"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "dogubako"
path = "src/main.rs"

[dependencies]
dogubako-core = { path = "../core" }
dogubako-tools = { path = "../tools", default-features = false }
dogubako-server = { path = "../server", default-features = false }
dogubako-mcp = { path = "../mcp" }
clap = { version = "4.6.7", features = ["string", "env", "wrap_help"] }
tokio = { version = "1.54.1", features = ["full"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
serde_json = "1.0.154"
indicatif = "0.18.6"
tracing = "0.1.44"
rpassword = "7.5.4"
tokio-util = "0.7.20"
async-trait = "0.1.92"
serde = { version = "1.0.229", features = ["derive"] }
tempfile = "3.27.0"

[features]
default = ["all-tools"]
all-tools = ["dogubako-tools/default", "dogubako-server/all-tools"]

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"
